# Publication automatique du site sur GitHub Pages.
#
# Se déclenche à chaque modification envoyée sur la branche `main` : le site est
# reconstruit puis mis en ligne, généralement en une à deux minutes.
#
# RÉGLAGE À FAIRE UNE SEULE FOIS, avant la première publication :
#   Settings → Pages → Build and deployment → Source = « GitHub Actions »
#
# Ce réglage ne peut pas être automatisé : le jeton d'un workflow a le droit de
# publier sur Pages, mais pas de créer le site Pages, qui relève de
# l'administration du dépôt.

name: Déploiement du site

on:
  push:
    branches: [main]
  # Permet aussi de relancer la publication à la main depuis l'onglet Actions.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois ; les envois rapprochés attendent leur tour.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  construction:
    name: Construction
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      # Vérifie les fichiers de contenu avant de construire : une erreur de
      # saisie dans un .yaml ou un .md arrête la publication ici, avec un
      # message explicite, plutôt que de mettre en ligne une page cassée.
      - name: Vérifier le contenu
        run: npm run check

      - name: Construire le site
        run: npm run build

      - name: Préparer la mise en ligne
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publication:
    name: Mise en ligne
    needs: construction
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Publier sur GitHub Pages
        id: deploiement
        uses: actions/deploy-pages@v4

# =============================================================================
#  CONFIGURATION DE L'INTERFACE D'ÉDITION (Pages CMS — https://app.pagescms.org)
#  -----------------------------------------------------------------------------
#  Ce fichier décrit les formulaires affichés dans Pages CMS. Il ne change rien
#  au site lui-même.
#
#  Chaque champ reprend une règle des schémas Zod de `src/data/index.ts` et de
#  `src/content.config.ts`. Modifier un schéma impose de modifier ce fichier :
#  sinon l'interface accepte une saisie que la construction refusera ensuite.
#
#  Attention : à l'enregistrement, Pages CMS réécrit entièrement le fichier et
#  SUPPRIME tout champ qui n'est pas décrit ici. Un champ ajouté à un schéma
#  mais oublié dans ce fichier disparaît donc au premier enregistrement.
#  Les commentaires (# …) des fichiers .yaml et .md disparaissent aussi : les
#  consignes destinées à la personne qui édite vivent donc ici, dans les
#  « description » des champs.
# =============================================================================

media:
  - name: images
    label: Images
    input: public/images
    output: /images
    categories: [image]
    rename: safe
  # Les photos de chantiers. Le sélecteur enregistre leur adresse sur le site,
  # par exemple /images/realisations/pergola-bois.jpg (voir `schemaPhoto`).
  # Les fichiers sont rangés dans src/assets/ : le site en produit à la
  # construction des versions allégées, à la taille de chaque emplacement.
  - name: realisations
    label: Photos de chantiers
    input: src/assets/realisations
    output: /images/realisations
    categories: [image]
    rename: safe

settings:
  commit:
    identity: user
    templates:
      create: 'Créer {path} depuis Pages CMS'
      update: 'Modifier {path} depuis Pages CMS'
      delete: 'Supprimer {path} depuis Pages CMS'
      rename: 'Renommer {oldPath} en {newPath} depuis Pages CMS'

components:
  photo:
    label: Photo
    description: >-
      Choisissez une photo de chantier, ou déposez-en une nouvelle (2048 pixels
      maximum sur le plus grand côté). Envoyez la photo d'origine, sans la
      réduire ni la recompresser : chaque passage la rend plus floue.
    type: image
    options:
      media: realisations

content:
  # --- Texte des pages : src/content/pages/*.md ------------------------------
  - name: pages
    label: Pages
    description: >-
      Le texte de chaque page du site. Pour créer une nouvelle page, il faut
      aussi modifier le code : demandez-le.
    type: collection
    path: src/content/pages
    format: yaml-frontmatter
    # Une page n'existe que si un fichier .astro lui correspond : on ne crée,
    # ne renomme et ne supprime donc pas de page depuis l'interface.
    operations:
      create: false
      rename: false
      delete: false
    view:
      fields: [titre, description]
      primary: titre
    fields:
      - name: titre
        label: Titre de la page
        description: >-
          Affiché dans l'onglet du navigateur et en titre dans les résultats
          Google, suivi du nom de l'entreprise. 40 caractères maximum, avec la
          ville quand c'est possible (par exemple « Prestations de rénovation à
          Angoulême »).
        type: string
        required: true
      - name: description
        label: Résumé pour Google
        description: >-
          Phrase affichée par Google sous le titre de la page. Idéalement entre
          150 et 160 caractères.
        type: text
        required: true
      - name: hero
        label: Grand bandeau du haut de page
        description: Facultatif. Laissez tout vide pour ne pas afficher de bandeau.
        type: object
        fields:
          - name: surtitre
            label: Surtitre
            description: >-
              Petite ligne en capitales au-dessus du titre. Facultatif : sans
              surtitre, le métier et la zone d'intervention s'affichent.
            type: string
          - name: titre
            label: Titre du bandeau
            type: string
            required: true
          - name: texte
            label: Texte du bandeau
            type: text
            required: true
          - name: ctaTexte
            label: Texte du bouton
            description: Facultatif. Sans texte, aucun bouton n'est affiché.
            type: string
          - name: ctaUrl
            label: Lien du bouton
            description: >-
              Adresse d'une page du site, avec le « / » au début et à la fin, par
              exemple /contact/
            type: string
          - name: photo
            component: photo
            label: Photo principale
            description: >-
              Facultatif. Avec une photo, le bandeau passe sur deux colonnes :
              texte à gauche, photo en arche à droite.
          - name: photoSecondaire
            component: photo
            label: Petite photo ronde
            description: >-
              Facultatif. Affichée en médaillon devant la photo principale.
              Sans photo principale, elle n'apparaît pas.
          - name: legendePhoto
            label: Légende de la photo
            description: >-
              Facultatif. Courte phrase posée sur la photo principale ; sert
              aussi de description pour les personnes malvoyantes.
            type: string
      - name: savoirFaire
        label: Bloc « Savoir-faire » (page d'accueil uniquement)
        description: >-
          Le titre au-dessus des cartes de prestations. Les cartes elles-mêmes se
          modifient dans « Prestations ». Laissez tout vide pour masquer le bloc.
        type: object
        fields:
          - name: surtitre
            label: Surtitre
            type: string
            required: true
          - name: titre
            label: Titre
            type: string
            required: true
          - name: lien
            label: Texte du lien vers la page Prestations
            type: string
            required: true
      - name: chantierUne
        label: Bloc « Chantier à la une » (page d'accueil uniquement)
        description: >-
          Un chantier mis en avant, avec une grande photo et quelques étapes.
          Laissez tout vide pour masquer le bloc.
        type: object
        fields:
          - name: surtitre
            label: Pastille sur la photo
            description: Par exemple « Chantier à la une ».
            type: string
            required: true
          - name: titre
            label: Titre
            type: string
            required: true
          - name: texte
            label: Texte
            type: text
            required: true
          - name: photo
            component: photo
            label: Grande photo
            required: true
          - name: etapes
            label: Étapes en images
            description: >-
              Facultatif. Petites photos sous le texte, dans l'ordre de la liste.
              Trois au maximum pour garder une seule rangée.
            type: object
            list:
              collapsible:
                collapsed: true
                summary: '{legende}'
            fields:
              - name: photo
                component: photo
                required: true
              - name: legende
                label: Légende
                description: Par exemple « 1 · Structure ».
                type: string
                required: true
          - name: bouton
            label: Texte du bouton vers les réalisations
            type: string
            required: true
      - name: etapes
        label: Bloc « Comment se passe un projet » (page d'accueil uniquement)
        description: Les étapes numérotées. Laissez tout vide pour masquer le bloc.
        type: object
        fields:
          - name: titre
            label: Titre
            type: string
            required: true
          - name: liste
            label: Étapes
            description: Dans l'ordre ; le numéro s'ajoute tout seul.
            type: object
            required: true
            list:
              min: 1
              collapsible:
                collapsed: true
                summary: '{titre}'
            fields:
              - name: titre
                label: Titre de l'étape
                type: string
                required: true
              - name: texte
                label: Texte
                type: text
                required: true
      - name: appel
        label: Bandeau d'appel au devis, en bas de page
        description: >-
          Utilisé sur l'accueil et sur Réalisations. Le bouton et le numéro de
          téléphone s'ajoutent tout seuls. Laissez tout vide pour le masquer.
        type: object
        fields:
          - name: titre
            label: Titre
            type: string
            required: true
          - name: texte
            label: Texte
            description: Facultatif.
            type: string
          - name: photo
            component: photo
            description: Facultatif. Affichée à droite du texte sur ordinateur.
      - name: body
        label: Contenu de la page
        description: Le texte sous le bandeau. Inutilisé sur l'accueil et sur Réalisations.
        type: rich-text
        options:
          format: markdown

  # --- Réglages généraux : src/data/site.yaml --------------------------------
  - name: site
    label: Réglages du site
    description: >-
      Tout ce qui apparaît sur plusieurs pages : nom, logo, coordonnées,
      horaires, menu, pied de page.
    type: file
    path: src/data/site.yaml
    format: yaml
    operations:
      delete: false
    fields:
      - name: nom
        label: Nom
        description: Le nom de l'entreprise, repris dans le titre des pages et les mentions légales.
        type: string
        required: true
      - name: logo
        label: Logo
        description: Affiché en haut de toutes les pages.
        type: image
        required: true
        options:
          media: images
      - name: metier
        label: Métier
        description: Par exemple « Rénovation et aménagement ».
        type: string
        required: true
      - name: description
        label: Résumé pour Google
        description: >-
          Résumé du site affiché par Google. Idéalement entre 150 et 160
          caractères.
        type: text
        required: true
      - name: zone
        label: Zone d'intervention
        description: Par exemple « Angoulême et alentours ».
        type: string
        required: true
      - name: photoPartage
        label: Photo de partage
        description: >-
          Affichée quand un lien du site est partagé (WhatsApp, Facebook, SMS…).
          Elle est recadrée au format paysage : choisissez une photo en largeur.
        component: photo
        required: true
      - name: formeJuridique
        label: Forme juridique
        description: Par exemple « EURL ». Affichée dans le pied de page et les mentions légales.
        type: string
        required: true
      - name: contact
        label: Coordonnées
        type: object
        required: true
        fields:
          - name: email
            label: Adresse e-mail
            type: string
            required: true
            pattern:
              regex: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
              message: 'Adresse e-mail invalide, par exemple contact@exemple.fr'
          - name: telephone
            label: Téléphone (pour le lien cliquable)
            description: >-
              Format international, sans espace : +33 suivi du numéro sans le 0,
              par exemple +33612345678
            type: string
            required: true
            pattern:
              regex: '^\+[0-9]{6,15}$'
              message: 'Écrivez +33 suivi du numéro sans le 0 initial, sans espace.'
          - name: telephoneAffiche
            label: Téléphone (tel qu'affiché)
            description: La façon dont le numéro s'affiche, par exemple 06 12 34 56 78
            type: string
            required: true
          - name: adresse
            label: Adresse
            description: >-
              Sous la forme « rue, code postal ville », par exemple
              17 rue Angel Albert, 16000 Angoulême. Google lit la ville et le
              code postal après la virgule.
            type: string
            required: true
            pattern:
              regex: '^.+,\s*\d{5}\s+\S.*$'
              message: 'Écrivez la rue, une virgule, puis le code postal et la ville.'
          - name: siret
            label: SIRET
            description: Obligatoire, affiché sur la page des mentions légales.
            type: string
            required: true
      - name: horaires
        label: Horaires
        description: Une ligne par plage horaire, dans l'ordre d'affichage.
        type: object
        required: true
        list:
          min: 1
          collapsible:
            collapsed: true
            summary: '{jour} : {heures}'
        fields:
          - name: jour
            label: Jour(s)
            description: Par exemple « Lundi – Vendredi ».
            type: string
            required: true
          - name: heures
            label: Heures
            description: Par exemple « 8h00 – 18h00 » ou « Fermé ».
            type: string
            required: true
      - name: reseaux
        label: Réseaux sociaux
        description: Affichés dans le pied de page. La liste peut rester vide.
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{nom}'
        fields:
          - name: nom
            label: Nom du réseau
            description: Par exemple « Instagram ».
            type: string
            required: true
          - name: url
            label: Adresse du profil
            type: string
            required: true
            pattern:
              regex: '^https?://\S+$'
              message: "L'adresse doit commencer par https://"
      - name: menu
        label: Menu de navigation
        description: >-
          L'ordre des lignes est l'ordre d'affichage. Vous pouvez renommer ou
          réordonner les entrées ; pour ajouter une page, il faut aussi modifier
          le code : demandez-le.
        type: object
        required: true
        list:
          min: 1
          collapsible:
            collapsed: true
            summary: '{texte}'
        fields:
          - name: texte
            label: Texte affiché
            type: string
            required: true
          - name: url
            label: Adresse de la page
            description: Avec le « / » au début et à la fin, par exemple /contact/
            type: string
            required: true
            pattern:
              regex: '^/([a-z0-9-]+/)*$'
              message: 'Commencez et terminez par « / », sans accent ni espace, par exemple /contact/'
      - name: ctaPrincipal
        label: Bouton d'appel à l'action (en haut à droite)
        type: object
        required: true
        fields:
          - name: texte
            label: Texte du bouton
            type: string
            required: true
          - name: url
            label: Lien du bouton
            description: Adresse d'une page du site, par exemple /contact/
            type: string
            required: true

  # --- Prestations : src/data/prestations.yaml -------------------------------
  - name: prestations
    label: Prestations
    description: >-
      Alimente la page Prestations et l'aperçu de la page d'accueil. L'ordre de
      la liste est l'ordre d'affichage.
    type: file
    path: src/data/prestations.yaml
    format: yaml
    operations:
      delete: false
    list:
      min: 1
      collapsible:
        collapsed: true
        summary: '{titre}'
    fields:
      - name: id
        label: Identifiant
        description: >-
          Nom technique unique, en minuscules, sans accent ni espace, par
          exemple pose-terrasse. Il n'est pas affiché sur le site.
        type: string
        required: true
        pattern:
          regex: '^[a-z0-9-]+$'
          message: 'Minuscules, chiffres et tirets uniquement, par exemple pose-terrasse'
      - name: titre
        label: Titre
        type: string
        required: true
      - name: description
        label: Description
        type: text
        required: true
      - name: photo
        component: photo
        description: Facultatif. Affichée en haut de la carte de la prestation.
      - name: tarif
        label: Tarif
        description: Facultatif. Par exemple « Sur devis » ou « À partir de 450 € ».
        type: string
      - name: details
        label: Points forts
        description: Facultatif. Une courte phrase par ligne.
        type: string
        list: true

  # --- Réalisations : src/data/realisations.yaml -----------------------------
  - name: realisations
    label: Réalisations
    description: >-
      Les photos de chantiers : page Réalisations et mosaïque de la page
      d'accueil. Sur la page Réalisations, les photos sont rangées par
      catégorie, dans l'ordre de la liste.
    type: file
    path: src/data/realisations.yaml
    format: yaml
    operations:
      delete: false
    fields:
      - name: apercuAccueil
        label: Bloc « Réalisations » de la page d'accueil
        description: Les textes autour de la mosaïque de photos.
        type: object
        required: true
        fields:
          - name: surtitre
            label: Surtitre
            type: string
            required: true
          - name: titre
            label: Titre
            type: string
            required: true
          - name: bouton
            label: Texte du bouton vers la page Réalisations
            type: string
            required: true
      - name: categories
        label: Catégories
        description: >-
          Les rubriques de la page Réalisations, dans l'ordre d'affichage. Avant
          de supprimer une catégorie, changez la catégorie de ses photos.
        type: object
        required: true
        list:
          min: 1
          collapsible:
            collapsed: true
            summary: '{titre}'
        fields:
          - name: id
            label: Identifiant
            description: >-
              Nom technique unique, en minuscules, sans accent ni espace, par
              exemple exterieurs. C'est lui qu'on indique dans chaque photo.
            type: string
            required: true
            pattern:
              regex: '^[a-z0-9-]+$'
              message: 'Minuscules, chiffres et tirets uniquement, par exemple exterieurs'
          - name: titre
            label: Titre affiché
            type: string
            required: true
      - name: photos
        label: Photos
        type: object
        required: true
        list:
          min: 1
          collapsible:
            collapsed: true
            summary: '{legende}'
        fields:
          - name: fichier
            component: photo
            required: true
          - name: legende
            label: Légende
            description: Affichée sous la photo ; sert aussi de description pour les personnes malvoyantes.
            type: string
            required: true
          - name: categorie
            label: Catégorie
            description: >-
              L'identifiant d'une des catégories ci-dessus, par exemple
              exterieurs, interieurs ou renovation.
            type: string
            required: true
          - name: etiquette
            label: Pastille
            description: Facultatif. Petit mot posé sur la photo, par exemple « Avant ».
            type: string
          - name: accueil
            label: Place dans la mosaïque de l'accueil
            description: >-
              Facultatif : laissez vide pour ne pas la montrer sur l'accueil.
              1 = grande photo en arche à gauche, 2 = large en haut au milieu,
              3 = haute à droite, 4 et 5 = petites en bas au milieu. Une seule
              photo par numéro.
            type: number
            options:
              min: 1
              max: 5
              step: 1

  # --- Avis clients : src/data/temoignages.yaml ------------------------------
  - name: temoignages
    label: Avis clients
    description: >-
      Affichés sur la page d'accueil, dans l'ordre de la liste. Si la liste est
      vide, la section disparaît.
    type: file
    path: src/data/temoignages.yaml
    format: yaml
    operations:
      delete: false
    list:
      collapsible:
        collapsed: true
        summary: '{auteur}'
    fields:
      - name: id
        label: Identifiant
        description: >-
          Nom technique unique, en minuscules, sans accent ni espace, par
          exemple claire-m. Il n'est pas affiché sur le site.
        type: string
        required: true
        pattern:
          regex: '^[a-z0-9-]+$'
          message: 'Minuscules, chiffres et tirets uniquement, par exemple claire-m'
      - name: texte
        label: Avis
        type: text
        required: true
      - name: auteur
        label: Auteur
        description: Par exemple « Claire M. ».
        type: string
        required: true
      - name: lieu
        label: Ville
        description: Facultatif.
        type: string

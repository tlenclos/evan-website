# --- Coordonnées ---------------------------------------------------------------
contact:
  email: 'contact@example.fr' # TODO
  # « telephone » sert au lien cliquable, « telephoneAffiche » à l'affichage.
  telephone: '+33600000000' # TODO : format international, sans espaces
  telephoneAffiche: '06 00 00 00 00' # TODO
  adresse: "12 rue de l'Atelier, 44000 Nantes" # TODO
  siret: '000 000 000 00000' # TODO : obligatoire sur les mentions légales

# --- Horaires ------------------------------------------------------------------
# Ajoutez ou supprimez des lignes librement, en gardant le tiret et l'alignement.

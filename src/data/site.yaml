metier: 'Rénovation et aménagement'
description: 'EB Concept & Rénovation, à Angoulême : électricité générale, plaquisterie, parquet, terrasses et pergolas en bois, travaux multiservices.' # résumé affiché par Google, 150-160 caractères
zone: 'Angoulême et alentours' # TODO : préciser le rayon d'intervention


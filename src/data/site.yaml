# =============================================================================
#  RÉGLAGES GÉNÉRAUX DU SITE
#  -----------------------------------------------------------------------------
#  Tout ce qui apparaît sur PLUSIEURS pages se règle ici : le nom, le menu,
#  les coordonnées, le pied de page.
#
#  Comment modifier : changez uniquement le texte entre guillemets, en gardant
#  les guillemets et l'indentation (les espaces en début de ligne) intacts.
#  Les lignes commençant par # sont des commentaires, elles ne s'affichent pas.

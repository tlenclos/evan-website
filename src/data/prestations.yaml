# =============================================================================
#  LES PRESTATIONS
#  -----------------------------------------------------------------------------
#  Cette liste alimente la page « Prestations » et l'aperçu de la page d'accueil.
#
#  Pour ajouter une prestation : copiez un bloc entier (du tiret jusqu'à la
#  dernière ligne indentée), collez-le à la suite et changez les textes.
#  Le champ « id » doit être unique et sans espaces ni accents.
#  Pour supprimer une prestation : effacez son bloc complet.
#
#  Les champs « tarif », « details » et « photo » sont facultatifs.
#  « photo » : adresse d'une photo de src/assets/realisations/, par exemple
#  '/images/realisations/salon-arche.jpg'.
# =============================================================================

# TODO : descriptions rédigées à partir du pitch d'Evan, à relire avec lui.
# Ajoutez un « tarif » (ex. 'Sur devis') si vous souhaitez en afficher un.

- id: electricite
  photo: '/images/realisations/meuble-tv-niches-eclairees.jpg'
  titre: 'Électricité générale'
  description: >-
    Installation, rénovation et mise aux normes de l'électricité, de la
    prise supplémentaire au tableau électrique complet.
  details:
    - 'Création et déplacement de prises et points lumineux'
    - 'Éclairage intégré, spots, rubans LED'
    - 'Remplacement de tableau électrique'

- id: plaquisterie
  photo: '/images/realisations/chambre-niche-arche.jpg'
  titre: 'Plaquisterie'
  description: >-
    Cloisons, doublages et faux plafonds en plaques de plâtre, jusqu'aux
    aménagements décoratifs : niches, arches, murs TV.
  details:
    - 'Cloisons et doublages isolants'
    - 'Faux plafonds'
    - 'Niches et arches sur mesure'

- id: parquet
  photo: '/images/realisations/salon-arche.jpg'
  titre: 'Parquet'
  description: >-
    Pose de parquet massif, contrecollé ou stratifié, avec les plinthes et
    les finitions.
  details:
    - 'Préparation du support'
    - 'Pose flottante, collée ou clouée'
    - 'Plinthes et barres de seuil'

- id: terrasses-pergolas
  photo: '/images/realisations/terrasse-bois-piscine-1.jpg'
  titre: 'Terrasses et pergolas en bois'
  description: >-
    Terrasses en bois, tours de piscine et pergolas, conçues et posées sur
    mesure pour prolonger la maison vers l'extérieur.
  details:
    - 'Structure sur plots ou lambourdes'
    - 'Habillage bois de piscine'
    - 'Pergolas en bois massif'

- id: multiservices
  photo: '/images/realisations/habillage-escalier.jpg'
  titre: 'Travaux multiservices'
  description: >-
    Les petits et moyens travaux de la maison, avec le même soin qu'un
    chantier complet.
  details:
    - 'Pose de portes, étagères, rangements'
    - 'Petites réparations et finitions'

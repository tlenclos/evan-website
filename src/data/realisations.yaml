# =============================================================================
#  LES RÉALISATIONS (photos de chantiers)
#  -----------------------------------------------------------------------------
#  Cette liste alimente la page « Réalisations » et la mosaïque de l'accueil.
#  Sur la page Réalisations, les photos sont rangées par catégorie, dans l'ordre
#  de ce fichier.
#
#  Pour ajouter une photo :
#    1. déposez-la dans public/images/realisations/ (nom sans accent ni espace,
#       1600 pixels maximum sur le plus grand côté) ;
#    2. copiez un bloc ci-dessous et changez « fichier » (l'adresse de la
#       photo : '/images/realisations/nom-du-fichier.jpg'), « legende » et
#       « categorie » (l'un des « id » de la liste des catégories).
#
#  « etiquette » (facultatif) affiche une pastille sur la photo, ex. 'Avant'.
#
#  « accueil » (facultatif) place la photo dans la mosaïque de la page
#  d'accueil, à la place indiquée :
#    1 = grande photo en arche à gauche, 2 = large en haut au milieu,
#    3 = haute à droite, 4 et 5 = petites en bas au milieu.
# =============================================================================

# --- Bloc « Réalisations » de la page d'accueil ------------------------------
apercuAccueil:
  surtitre: 'Réalisations'
  titre: 'Quelques chantiers récents'
  bouton: 'Toutes les réalisations'

# --- Les catégories, dans l'ordre d'affichage ------------------------------------
categories:
  - id: exterieurs
    titre: 'Extérieurs'
  - id: interieurs
    titre: 'Intérieurs'
  - id: renovation
    titre: 'Rénovation'


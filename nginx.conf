# Configuration nginx du site — utilisée par le Dockerfile.
#
# Elle décrit comment les fichiers construits dans `dist/` sont servis :
# adressage des pages, page 404, durées de cache et compression.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Ne pas divulguer la version de nginx dans les en-têtes.
    server_tokens off;

    # Le conteneur est derrière le proxy de Coolify : les redirections doivent
    # être relatives, sinon nginx renverrait vers son adresse interne.
    absolute_redirect off;

    # Astro produit un dossier par page (`dist/contact/index.html`). On cherche
    # d'abord un fichier exact, puis un dossier contenant un index.html.
    # Sans correspondance : une vraie 404, et non la page d'accueil.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }

    # Les fichiers de `_astro/` portent un nom unique à chaque construction :
    # ils peuvent être mis en cache indéfiniment par le navigateur.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Page 404 du site, avec sa mise en forme, plutôt que celle de nginx.
    error_page 404 /404.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;
}
